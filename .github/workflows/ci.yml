name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple silicon — the platform f1predict is tuned for.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        # the `apple` extra brings MLX: Metal on the macOS runner, CPU on Linux
        run: uv sync --all-groups --all-extras --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run basedpyright

      - name: Module boundaries
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

      - name: CLI smoke test
        run: |
          uv run f1p version
          uv run f1p doctor
          uv run f1p points 2026
          uv run f1p silicon info
          uv run f1p silicon bench --quick --no-save
