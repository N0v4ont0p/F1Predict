[project]
name = "f1predict"
version = "0.2.0.dev0"
description = "Probabilistic Formula 1 forecasting: a generative world model of the race weekend, tuned for Apple silicon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
authors = [{ name = "f1predict contributors" }]
keywords = ["formula1", "forecasting", "bayesian", "monte-carlo", "apple-silicon"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.4",
    "httpx>=0.28",
    "numpy>=2.2",
    "polars>=1.30",
    "pyarrow>=21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "scipy>=1.15",
    "threadpoolctl>=3.5",
    "typer>=0.15",
]

[project.scripts]
f1p = "f1p.cli.main:app"

[project.optional-dependencies]
apple = [
    "mlx>=0.32; sys_platform == 'darwin'",
    "mlx[cpu]>=0.32; sys_platform == 'linux'",
]
ml = [
    "catboost>=1.2",
    "lightgbm>=4.5",
]
bayes = [
    "blackjax>=1.2",
    "jax>=0.7",
    "numpyro>=0.19",
    "nutpie>=0.16",
    "pymc>=5.25",
]
tune = [
    "cmaes>=0.11",
    "optuna>=4.5",
]
tfm = [
    "tabicl>=2.0",
    "torch>=2.8",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "hypothesis>=6.120",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# PyTorch (the `tfm` extra): CPU wheels on Linux (CI, servers) — PyPI's Linux build pulls
# ~3 GB of CUDA libraries; macOS takes PyPI's build, which has the MPS (Metal) back end.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "f1p"

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET", "TID"]
# Short module aliases (`schema as S`, `points as P`) keep dense table code readable.
ignore = ["N812"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- types
[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "apple: requires Apple silicon (skipped elsewhere)",
]

# ---------------------------------------------------------------- module boundaries (§5.2)
# Lower layers must never import higher ones. Layers are added to the contract as they land.
[tool.importlinter]
root_package = "f1p"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "f1p.cli",
    "f1p.tuning",
    "f1p.models",
    "f1p.eval",
    "f1p.lake",
    "f1p.sources",
    "f1p.silicon",
    "f1p.core",
]
